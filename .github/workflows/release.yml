# Release — on a semver tag (v1.2.3): test, build, push semver tags, publish
# GitHub release notes generated from the merged PRs since the last tag.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # create the GitHub release
      packages: write   # push semver tags to GHCR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Versions
        id: v
        run: |
          version="${GITHUB_REF_NAME#v}"          # 1.2.3
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"   # 1.2
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/${{ steps.v.outputs.owner }}/civicpulse-backend:${{ steps.v.outputs.version }}
            ghcr.io/${{ steps.v.outputs.owner }}/civicpulse-backend:${{ steps.v.outputs.minor }}
            ghcr.io/${{ steps.v.outputs.owner }}/civicpulse-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          push: true
          tags: |
            ghcr.io/${{ steps.v.outputs.owner }}/civicpulse-frontend:${{ steps.v.outputs.version }}
            ghcr.io/${{ steps.v.outputs.owner }}/civicpulse-frontend:${{ steps.v.outputs.minor }}
            ghcr.io/${{ steps.v.outputs.owner }}/civicpulse-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
      - name: GitHub release with generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag --title "CivicPulse $GITHUB_REF_NAME"
