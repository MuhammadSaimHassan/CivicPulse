# CD — on every push to main (i.e. every merged PR).
#
#   test ──▶ build-push ──▶ deploy-k8s
#
# Every publishing/deploying job is gated by `needs:`: nothing is published
# from code the suite has not just passed on, and nothing is deployed that was
# not just built, scanned, signed and verified. The deploy uses the image
# DIGEST (immutable), never :latest.
name: cd

on:
  push:
    branches: [main]

# Default for every job: read-only. Jobs that need more ask for exactly that.
permissions:
  contents: read

concurrency:
  group: cd-main
  cancel-in-progress: false   # never cancel a deploy half-way

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: test (full CI suite on the merged result)
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build-push:
    name: build-push
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write   # push to GHCR with the scoped, short-lived GITHUB_TOKEN
      id-token: write   # keyless Cosign signing via GitHub OIDC
    outputs:
      backend_digest: ${{ steps.backend.outputs.digest }}
      frontend_digest: ${{ steps.frontend.outputs.digest }}
      owner: ${{ steps.owner.outputs.owner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: owner
        name: Lowercase owner (GHCR requires it)
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: backend
        name: Build + push backend (tagged with commit SHA and latest)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.owner }}/civicpulse-backend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.owner }}/civicpulse-backend:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - id: frontend
        name: Build + push frontend (tagged with commit SHA and latest)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.owner }}/civicpulse-frontend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.owner }}/civicpulse-frontend:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: SBOM (Syft) — backend
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.REGISTRY }}/${{ steps.owner.outputs.owner }}/civicpulse-backend@${{ steps.backend.outputs.digest }}
          format: spdx-json
          output-file: sbom-backend.spdx.json
          upload-artifact: false
      - name: SBOM (Syft) — frontend
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.REGISTRY }}/${{ steps.owner.outputs.owner }}/civicpulse-frontend@${{ steps.frontend.outputs.digest }}
          format: spdx-json
          output-file: sbom-frontend.spdx.json
          upload-artifact: false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ github.sha }}
          path: sbom-*.spdx.json

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign images by digest (keyless, Sigstore)
        env:
          BACKEND: ${{ env.REGISTRY }}/${{ steps.owner.outputs.owner }}/civicpulse-backend@${{ steps.backend.outputs.digest }}
          FRONTEND: ${{ env.REGISTRY }}/${{ steps.owner.outputs.owner }}/civicpulse-frontend@${{ steps.frontend.outputs.digest }}
        run: |
          cosign sign --yes "$BACKEND"
          cosign sign --yes "$FRONTEND"

      - name: Summary — what was published
        run: |
          {
            echo "### Published"
            echo "| image | digest |"
            echo "|---|---|"
            echo "| civicpulse-backend:${GITHUB_SHA} | \`${{ steps.backend.outputs.digest }}\` |"
            echo "| civicpulse-frontend:${GITHUB_SHA} | \`${{ steps.frontend.outputs.digest }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-k8s:
    name: deploy-k8s (ephemeral k3d cluster)
    needs: build-push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read    # pull the private GHCR images into the cluster
    env:
      OWNER: ${{ needs.build-push.outputs.owner }}
      BACKEND_REF: ghcr.io/${{ needs.build-push.outputs.owner }}/civicpulse-backend@${{ needs.build-push.outputs.backend_digest }}
      FRONTEND_REF: ghcr.io/${{ needs.build-push.outputs.owner }}/civicpulse-frontend@${{ needs.build-push.outputs.frontend_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Verify signatures before deploying (only images this workflow signed)
        env:
          COSIGN_IDENTITY: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/cd.yml@${{ github.ref }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin
          for ref in "$BACKEND_REF" "$FRONTEND_REF"; do
            cosign verify "$ref" \
              --certificate-identity "$COSIGN_IDENTITY" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
            echo "verified: $ref"
          done

      - name: Install k3d + kustomize (pinned)
        run: |
          curl -sSL https://raw.githubusercontent.com/k3d-io/k3d/v5.9.0/install.sh | TAG=v5.9.0 bash
          curl -sSL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.5.0/kustomize_v5.5.0_linux_amd64.tar.gz | tar xz -C /usr/local/bin kustomize

      - name: Create ephemeral cluster (k3s ships Traefik + metrics-server)
        run: |
          k3d cluster create ci --agents 1 -p "8081:80@loadbalancer" --wait
          kubectl wait --for=condition=Available deployment/metrics-server -n kube-system --timeout=180s
          # The VPA object needs its CRD; the recommender itself is not needed in CI.
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/autoscaler/vertical-pod-autoscaler-1.8.0/vertical-pod-autoscaler/deploy/vpa-v1-crd-gen.yaml

      - name: Secrets from GitHub Secrets (never from the repository)
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          kubectl create namespace civicpulse
          kubectl -n civicpulse create secret docker-registry ghcr-pull \
            --docker-server=ghcr.io --docker-username="${{ github.actor }}" \
            --docker-password="${{ secrets.GITHUB_TOKEN }}"
          # Ephemeral cluster, ephemeral database passwords. The LLM key is the
          # only long-lived secret; if it is absent, triage falls back to rules.
          umask 077
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo "REDIS_PASSWORD=$(openssl rand -hex 24)"
            echo "LLM_API_KEY=${LLM_API_KEY}"
          } > k8s/overlays/prod/secrets.env

      - name: Deploy overlays/prod by immutable digest
        working-directory: k8s/overlays/prod
        run: |
          kustomize edit set image "civicpulse-backend=${BACKEND_REF}" "civicpulse-frontend=${FRONTEND_REF}"
          kustomize build . | grep -E '^\s+image: ' | sort -u
          kustomize build . | grep -q ':latest' && { echo "::error::refusing to deploy :latest"; exit 1; } || true
          kubectl apply -k .

      - name: Wait for rollout
        run: |
          kubectl -n civicpulse rollout status statefulset/postgres --timeout=240s
          kubectl -n civicpulse rollout status deployment/redis --timeout=180s
          kubectl -n civicpulse rollout status deployment/backend --timeout=300s
          kubectl -n civicpulse rollout status deployment/frontend --timeout=180s

      - name: Smoke test through the Ingress
        run: |
          set -euo pipefail
          H='Host: civicpulse.localhost'
          for i in $(seq 1 30); do
            curl -sf -H "$H" http://127.0.0.1:8081/api/stats >/dev/null && break
            sleep 2
          done
          curl -sf -H "$H" -o /dev/null -w "frontend / -> %{http_code}\n" http://127.0.0.1:8081/
          created=$(curl -sf -X POST -H "$H" -H 'Content-Type: application/json' http://127.0.0.1:8081/api/complaints \
            -d '{"text":"Transformer sparking near the school gate, live wire hanging","location":"Korangi 5, Karachi"}')
          echo "$created" | jq '{id, category, priority, triaged_by}'
          id=$(echo "$created" | jq -r .id)
          curl -sf -H "$H" "http://127.0.0.1:8081/api/complaints/$id" | jq -e '.category == "electricity"'
          curl -sf -H "$H" http://127.0.0.1:8081/api/meta/providers | jq '{active_provider, triage_cache}'

      - name: What is running
        if: always()
        run: |
          kubectl -n civicpulse get pods,svc,ingress,pdb -o wide
          kubectl -n civicpulse get hpa
          echo "backend image:  $(kubectl -n civicpulse get deploy backend -o jsonpath='{.spec.template.spec.containers[0].image}')"
          echo "frontend image: $(kubectl -n civicpulse get deploy frontend -o jsonpath='{.spec.template.spec.containers[0].image}')"

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl -n civicpulse describe pods | tail -n 120
          kubectl -n civicpulse logs deploy/backend --all-containers --tail=100 || true
          kubectl -n civicpulse get events --sort-by=.lastTimestamp | tail -n 40
