# Unprivileged nginx: no `user` directive, pid and temp paths under /tmp.
worker_processes auto;
pid /tmp/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    client_body_temp_path /tmp/nginx/client_temp;
    proxy_temp_path       /tmp/nginx/proxy_temp;
    fastcgi_temp_path     /tmp/nginx/fastcgi_temp;
    uwsgi_temp_path       /tmp/nginx/uwsgi_temp;
    scgi_temp_path        /tmp/nginx/scgi_temp;

    # JSON access log to stdout, carrying the same request id the backend logs.
    log_format json escape=json '{"ts":"$time_iso8601","level":"INFO","logger":"nginx",'
        '"request_id":"$req_id","method":"$request_method","path":"$uri","status":$status,'
        '"duration_ms":$request_time,"upstream_ms":"$upstream_response_time","client":"$remote_addr"}';
    access_log /dev/stdout json;

    # Reuse the caller's X-Request-ID, or mint one, and pass it to the backend.
    map $http_x_request_id $req_id {
        default $http_x_request_id;
        ""      $request_id;
    }

    # Cache policy by path. Vite fingerprints /assets/* filenames, so they can be
    # cached forever; index.html and config.js must always be revalidated; /api
    # responses keep whatever Cache-Control the backend sent (empty = not added).
    map $uri $cache_control {
        ~^/assets/   "public, max-age=31536000, immutable";
        /config.js   "no-store";
        ~^/api/      "";
        default      "no-cache";
    }

    sendfile on;
    server_tokens off;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Rendered at start-up from /etc/nginx/templates/*.template (envsubst).
    include /tmp/nginx/*.conf;
}
