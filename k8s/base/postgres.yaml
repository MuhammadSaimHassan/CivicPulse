# PostgreSQL as a StatefulSet, never a Deployment:
#  * volumeClaimTemplates gives the pod its OWN PersistentVolumeClaim
#    (data-postgres-0) that survives pod deletion and is re-attached to the
#    replacement pod with the same name.
#  * a stable identity (postgres-0) and ordered, one-at-a-time replacement:
#    a Deployment's rolling update could briefly run two postgres processes
#    against one data directory.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels: { app.kubernetes.io/name: postgres }
spec:
  type: ClusterIP          # never NodePort / LoadBalancer
  clusterIP: None          # headless: the StatefulSet's governing service
  selector: { app.kubernetes.io/name: postgres }
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels: { app.kubernetes.io/name: postgres }
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: postgres }
  template:
    metadata:
      labels: { app.kubernetes.io/name: postgres }
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70          # the alpine image's postgres user
        fsGroup: 70
        seccompProfile: { type: RuntimeDefault }
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          image: postgres:16.15-alpine3.24
          ports:
            - { name: postgres, containerPort: 5432 }
          env:
            - name: POSTGRES_DB
              valueFrom: { configMapKeyRef: { name: civicpulse-config, key: POSTGRES_DB } }
            - name: POSTGRES_USER
              valueFrom: { configMapKeyRef: { name: civicpulse-config, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: civicpulse-secrets, key: POSTGRES_PASSWORD } }
            # A subdirectory: the volume root may contain lost+found, which initdb refuses.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: run, mountPath: /var/run/postgresql }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          readinessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""] }
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""] }
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
      volumes:
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
