apiVersion: v1
kind: Service
metadata:
  name: backend
  labels: { app.kubernetes.io/name: backend }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: backend }
  ports:
    - { name: http, port: 8000, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels: { app.kubernetes.io/name: backend }
spec:
  replicas: 2                       # the HPA owns this number once it is running
  revisionHistoryLimit: 5           # what `kubectl rollout undo` can go back to
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1                   # one extra pod at a time
      maxUnavailable: 0             # never below the desired count: zero-downtime
  selector:
    matchLabels: { app.kubernetes.io/name: backend }
  template:
    metadata:
      labels: { app.kubernetes.io/name: backend }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      enableServiceLinks: false
      # Must exceed preStop (10 s) + SHUTDOWN_GRACE_SECONDS (20 s).
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        # Migrations + idempotent seed, before the app container starts.
        # Two replicas start at once; an advisory lock in app/migrate.py makes
        # exactly one of them run `alembic upgrade head`.
        - name: migrate
          image: civicpulse-backend
          command: ["python", "-m", "app.migrate", "--seed"]
          envFrom:
            - configMapRef: { name: civicpulse-config }
          env: &backend-env
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: civicpulse-secrets, key: POSTGRES_PASSWORD } }
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: civicpulse-secrets, key: REDIS_PASSWORD } }
            - name: LLM_API_KEY
              valueFrom: { secretKeyRef: { name: civicpulse-secrets, key: LLM_API_KEY, optional: true } }
            # $(VAR) references are expanded by Kubernetes from the vars above/envFrom.
            - name: DATABASE_URL
              value: postgresql+psycopg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)
            - name: REDIS_URL
              value: redis://:$(REDIS_PASSWORD)@redis:6379/0
          securityContext: &container-security
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 500m, memory: 256Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      containers:
        - name: backend
          image: civicpulse-backend
          ports:
            - { name: http, containerPort: 8000 }
          envFrom:
            - configMapRef: { name: civicpulse-config }
          env: *backend-env
          securityContext: *container-security
          # Requests are MANDATORY for the HPA: utilisation = usage / request.
          # Without resources.requests.cpu the HPA shows <unknown>/60% forever.
          # These are the first guess; see docs/ENGINEERING-NOTES.md (Q6) for the
          # VPA recommendation and what changed after applying it.
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 384Mi }
          # Slow start is not failure: up to 30 x 2 s = 60 s to come up before
          # liveness is even considered. This is what prevents boot restart loops.
          startupProbe:
            httpGet: { path: /health, port: http }
            failureThreshold: 30
            periodSeconds: 2
          # Liveness RESTARTS the container: it must not depend on the database,
          # or a slow database would restart every backend pod at once.
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Readiness REMOVES the pod from the Service: it should depend on the
          # database and Redis (and fails during shutdown drain).
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          lifecycle:
            # Runs BEFORE SIGTERM. Keeps serving while the endpoints controller
            # and kube-proxy/Ingress stop sending us new traffic; then SIGTERM
            # makes the app drain in-flight requests (app/server.py).
            preStop:
              exec: { command: ["sleep", "10"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
