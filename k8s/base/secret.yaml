# PLACEHOLDERS ONLY. Real values never enter Git.
# The overlays replace this Secret with a secretGenerator that reads
# overlays/<env>/secrets.env — a gitignored file created from your local .env
# (scripts/k8s-up.sh) or from GitHub Secrets (cd.yml).
# (Base64 is an encoding, not encryption: a key "hidden" in base64 here would
# be a committed key.)
apiVersion: v1
kind: Secret
metadata:
  name: civicpulse-secrets
type: Opaque
stringData:
  POSTGRES_PASSWORD: "REPLACE_ME"
  REDIS_PASSWORD: "REPLACE_ME"
  LLM_API_KEY: ""
