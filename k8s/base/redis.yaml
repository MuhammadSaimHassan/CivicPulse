# Redis: a Deployment + a PVC for the AOF file. One replica; strategy Recreate
# because a ReadWriteOnce volume cannot be mounted by the old and the new pod
# at the same time during a rolling update.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  labels: { app.kubernetes.io/name: redis }
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels: { app.kubernetes.io/name: redis }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: redis }
  ports:
    - { name: redis, port: 6379, targetPort: 6379 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels: { app.kubernetes.io/name: redis }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: redis }
  template:
    metadata:
      labels: { app.kubernetes.io/name: redis }
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999         # the redis image's redis user
        fsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: redis
          image: redis:7.4.11-alpine3.21
          # $(REDIS_PASSWORD) is expanded by Kubernetes from the env below.
          args: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--requirepass", "$(REDIS_PASSWORD)"]
          env:
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: civicpulse-secrets, key: REDIS_PASSWORD } }
            - name: REDISCLI_AUTH
              valueFrom: { secretKeyRef: { name: civicpulse-secrets, key: REDIS_PASSWORD } }
          ports:
            - { name: redis, containerPort: 6379 }
          volumeMounts:
            - { name: data, mountPath: /data }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["redis-cli", "ping"] }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 256Mi }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: redis-data }
